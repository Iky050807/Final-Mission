<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Final Mission // Restore Data Lab</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}"></head>
<body><div class="bg-vignette"></div><div class="bg-grid"></div>
<main class="landing-wrap"><div class="container" style="max-width:440px;margin:0 auto;"><div class="glass hud-corners" style="padding:34px 30px;">
  <div style="text-align:center;margin-bottom:20px;"><span class="eyebrow">OPERATION: RESTORE DATA LAB</span><h1 style="font-size:1.35rem;margin-top:8px;">Final Mission</h1>
  <p style="margin-top:8px;font-size:.88rem;">Masukkan Final Code dari Dislok untuk membuka Final Mission.</p></div>
  <div class="alert alert-error" id="err">Final Code salah. Periksa kembali.</div>
  <div class="field"><label for="code">Final Code</label><input type="text" id="code" autocomplete="off" style="text-transform:uppercase;"></div>
  <button type="button" class="btn btn-purple btn-block" id="go">VERIFY FINAL CODE</button>
</div></div></main>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
<script>
const go=document.getElementById("go"), err=document.getElementById("err");
async function verify(){ err.classList.remove("show"); go.disabled=true;
  try{ const r=await fetch("/api/final/verify-code",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:document.getElementById("code").value})});
    const d=await r.json(); if(d.success) location.href="/group"; else { err.textContent = d.reason==="too_many_attempts" ? "Terlalu banyak percobaan. Tunggu 1 menit." : "Final Code salah. Periksa kembali."; err.classList.add("show"); }
  }catch(e){ err.textContent="Koneksi bermasalah. Coba lagi."; err.classList.add("show"); }
  go.disabled=false; }
go.addEventListener("click",verify); document.getElementById("code").addEventListener("keydown",e=>{ if(e.key==="Enter") verify(); });
</script></body></html>
